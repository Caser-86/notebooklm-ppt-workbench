[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notebooklm-ppt-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<0.117",
  "uvicorn>=0.35,<0.36",
  "sqlmodel>=0.0.22,<0.0.23",
  "pydantic-settings>=2.10,<2.11",
  "python-multipart>=0.0.26,<0.1",
  "httpx>=0.28,<0.29",
  "beautifulsoup4>=4.12,<4.13",
  "faster-whisper>=1.1,<1.2",
  "ffmpeg-python>=0.2.0,<0.3",
  "playwright>=1.50,<1.51",
  "python-docx>=1.1,<1.2",
  "python-pptx>=1.0,<1.1",
  "pymupdf>=1.25,<1.26",
  "pillow>=11.0,<11.1",
  "rapidocr-onnxruntime>=1.2,<1.3",
  "requests>=2.32,<2.33",
  "alembic>=1.14,<1.15"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<8.4"
]

[tool.setuptools.packages.find]
include = ["app*"]
